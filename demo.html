<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CaptionHUD demo</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0b0b10;
    color: #e8e8ee;
    padding: 24px;
  }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  p.lede { margin: 0 0 20px; color: #9a9aa8; max-width: 70ch; }

  .stage {
    display: flex;
    gap: 24px;
    align-items: flex-start;
    flex-wrap: wrap;
  }

  .panel {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .panel h2 {
    font-size: 0.95rem;
    margin: 0;
    color: #c7c7d6;
  }

  /* Left: video/canvas overlay demo */
  .video-frame {
    position: relative;
    width: 480px;
    height: 270px;
    border-radius: 12px;
    overflow: hidden;
    background: #000;
    border: 1px solid #2a2a35;
  }
  .video-frame canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  .overlay-target {
    position: absolute;
    inset: 0;
  }

  /* Right: phone-shaped fullscreen demo */
  .phone-shell {
    width: 300px;
    height: 620px;
    background: #111;
    border-radius: 34px;
    padding: 14px;
    border: 2px solid #333;
    box-shadow: 0 0 0 6px #000 inset, 0 8px 30px rgba(0,0,0,0.5);
  }
  .phone-screen {
    position: relative;
    width: 100%;
    height: 100%;
    background: #050507;
    border-radius: 20px;
    overflow: hidden;
  }
  .phone-notch {
    position: absolute;
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 8px;
    background: #000;
    border-radius: 6px;
    z-index: 10;
  }

  .controls {
    margin-top: 28px;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: center;
    background: #16161d;
    border: 1px solid #2a2a35;
    border-radius: 12px;
    padding: 16px;
    max-width: 900px;
  }
  .controls button {
    background: #2b6ef2;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .controls button:hover { background: #3d7bf5; }
  .controls label {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 0.8rem;
    color: #b6b6c4;
  }
  .controls .checkbox-row {
    flex-direction: row;
    align-items: center;
    gap: 6px;
  }
  .controls input[type="range"] { width: 140px; }
</style>
</head>
<body>
  <h1>CaptionHUD demo</h1>
  <p class="lede">
    One stream of <code>{who, color, text}</code> events, driving two independent
    HUDs — a bottom-anchored overlay composited over a moving test pattern, and a
    fullscreen phone stand-in for smart glasses.
  </p>

  <div class="stage">
    <div class="panel">
      <h2>Overlay mode (video/canvas)</h2>
      <div class="video-frame">
        <canvas id="pattern" width="480" height="270"></canvas>
        <div id="overlay-target" class="overlay-target"></div>
      </div>
    </div>

    <div class="panel">
      <h2>Fullscreen mode (phone stand-in)</h2>
      <div class="phone-shell">
        <div class="phone-screen">
          <div class="phone-notch"></div>
          <div id="fullscreen-target" style="position:absolute; inset:0;"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="btn-push">Push random caption</button>
    <button id="btn-stream">Streaming demo</button>

    <label>
      maxVisible: <span id="maxVisible-val">3</span>
      <input id="maxVisible" type="range" min="1" max="6" step="1" value="3" />
    </label>

    <label>
      fontSizePx: <span id="fontSizePx-val">22</span>
      <input id="fontSizePx" type="range" min="14" max="40" step="1" value="22" />
    </label>

    <label class="checkbox-row">
      <input id="reduceMotion" type="checkbox" />
      Force reduced motion
    </label>
  </div>

  <script type="module">
    import { CaptionHUD } from './caption-hud.js';

    // -- animated test pattern (bright, moving background) --
    const canvas = document.getElementById('pattern');
    const ctx = canvas.getContext('2d');
    let t = 0;
    function drawPattern() {
      const w = canvas.width, h = canvas.height;
      t += 0.02;
      const grad = ctx.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, `hsl(${(t * 40) % 360}, 90%, 55%)`);
      grad.addColorStop(0.5, `hsl(${(t * 40 + 120) % 360}, 90%, 55%)`);
      grad.addColorStop(1, `hsl(${(t * 40 + 240) % 360}, 90%, 55%)`);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      for (let i = 0; i < 6; i++) {
        const x = (Math.sin(t + i) * 0.5 + 0.5) * w;
        const y = (Math.cos(t * 1.3 + i * 2) * 0.5 + 0.5) * h;
        ctx.beginPath();
        ctx.arc(x, y, 26, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${(i * 60 + t * 80) % 360}, 100%, 70%, 0.85)`;
        ctx.fill();
      }
      requestAnimationFrame(drawPattern);
    }
    drawPattern();

    // -- fake speakers --
    const SPEAKERS = [
      { who: 'Speaker 1', color: '#38bdf8' },
      { who: 'Speaker 2', color: '#4ade80' },
      { who: 'Speaker 3', color: '#f472b6' },
      { who: 'Multiple speakers', color: '#f59e0b' },
      { who: 'Unknown speaker', color: '#9ca3af' },
    ];

    const SENTENCES = [
      "Hey, can you hear me okay from over there?",
      "Let's grab coffee before the next session starts.",
      "I think the demo is running a little behind schedule.",
      "That's a great point, I hadn't considered it that way.",
      "Sorry, could you say that one more time?",
      "The train leaves in about twenty minutes.",
      "I'll send the slides over right after this.",
    ];

    function randomOf(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    // -- HUD instances + rebuild-on-settings-change --
    const overlayTarget = document.getElementById('overlay-target');
    const fullscreenTarget = document.getElementById('fullscreen-target');

    let overlayHud = null;
    let fullscreenHud = null;
    const eventLog = [];

    function currentSettings() {
      return {
        maxVisible: Number(document.getElementById('maxVisible').value),
        fontSizePx: Number(document.getElementById('fontSizePx').value),
        reduceMotion: document.getElementById('reduceMotion').checked ? true : 'auto',
      };
    }

    function buildHuds() {
      if (overlayHud) overlayHud.destroy();
      if (fullscreenHud) fullscreenHud.destroy();

      const settings = currentSettings();
      overlayHud = new CaptionHUD(overlayTarget, { mode: 'overlay', ...settings });
      fullscreenHud = new CaptionHUD(fullscreenTarget, { mode: 'fullscreen', ...settings });

      for (const event of eventLog) {
        overlayHud.push(event);
        fullscreenHud.push(event);
      }
    }

    function pushCaption(event) {
      eventLog.push(event);
      // Keep the replay log from growing unbounded across a long demo session.
      if (eventLog.length > 50) eventLog.shift();
      overlayHud.push(event);
      fullscreenHud.push(event);
      return event;
    }

    function updateCaption(text) {
      const newest = eventLog[eventLog.length - 1];
      if (newest) newest.text = text;
      overlayHud.update(text);
      fullscreenHud.update(text);
    }

    document.getElementById('btn-push').addEventListener('click', () => {
      const speaker = randomOf(SPEAKERS);
      pushCaption({ who: speaker.who, color: speaker.color, text: randomOf(SENTENCES) });
    });

    document.getElementById('btn-stream').addEventListener('click', () => {
      const speaker = randomOf(SPEAKERS);
      const words = randomOf(SENTENCES).split(' ');
      pushCaption({ who: speaker.who, color: speaker.color, text: '' });
      let i = 0;
      const interval = setInterval(() => {
        i++;
        updateCaption(words.slice(0, i).join(' '));
        if (i >= words.length) clearInterval(interval);
      }, 220);
    });

    for (const id of ['maxVisible', 'fontSizePx']) {
      const input = document.getElementById(id);
      const label = document.getElementById(`${id}-val`);
      input.addEventListener('input', () => {
        label.textContent = input.value;
        buildHuds();
      });
    }
    document.getElementById('reduceMotion').addEventListener('change', buildHuds);

    buildHuds();
  </script>
</body>
</html>
