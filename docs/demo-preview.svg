<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="testpattern" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="45%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <style>
      .bg { fill:#0a0a0f; }
      .label { fill:#e5e7eb; font-size:12px; font-weight:700; }
      .frame { fill:#08090c; stroke:#39FF14; stroke-width:2; rx:22; }
      .cap { fill:#0b0b0dcc; stroke:#22c55e; stroke-width:1; rx:6; }
      .speaker { fill:#4ade80; font-size:9px; font-weight:800; letter-spacing:1px; }
      .txt { fill:#f5f5f5; font-size:14px; font-weight:700; }
      .txt2 { fill:#f5f5f5; font-size:11px; font-weight:700; }
    </style>
  </defs>
  <rect width="900" height="420" fill="#111827"/>
  <text x="20" y="26" class="label" font-size="15">CaptionHUD — overlay mode (left) · fullscreen mode (right)</text>

  <!-- overlay panel -->
  <rect x="20" y="50" width="440" height="260" fill="url(#testpattern)" rx="6"/>
  <circle cx="55" cy="90" r="20" fill="#ec4899" opacity="0.85"/>
  <circle cx="45" cy="125" r="16" fill="#a855f7" opacity="0.85"/>
  <circle cx="410" cy="80" r="18" fill="#facc15" opacity="0.85"/>
  <circle cx="380" cy="120" r="20" fill="#4ade80" opacity="0.85"/>
  <circle cx="190" cy="270" r="14" fill="#38bdf8" opacity="0.85"/>
  <circle cx="230" cy="275" r="14" fill="#f97316" opacity="0.85"/>

  <rect x="34" y="235" width="360" height="58" class="cap"/>
  <text x="46" y="255" class="speaker">SPEAKER 3</text>
  <text x="46" y="273" class="txt2">Hey, can you hear me okay from over</text>
  <text x="46" y="288" class="txt2">there?</text>

  <!-- phone / fullscreen mockup -->
  <rect x="500" y="30" width="220" height="380" class="frame"/>
  <rect x="530" y="180" width="160" height="150" class="cap"/>
  <text x="610" y="205" text-anchor="middle" class="speaker">SPEAKER 3</text>
  <text x="610" y="230" text-anchor="middle" class="txt">Hey, can</text>
  <text x="610" y="252" text-anchor="middle" class="txt">you hear me</text>
  <text x="610" y="274" text-anchor="middle" class="txt">okay from</text>
  <text x="610" y="296" text-anchor="middle" class="txt">over there?</text>

  <text x="20" y="335" fill="#9ca3af" font-size="11">Zero dependencies · scoped styles · high-contrast plates · fades after fadeAfterMs · reduceMotion-aware</text>
</svg>
